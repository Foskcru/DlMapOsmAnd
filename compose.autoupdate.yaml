services:
  dlmaposmand:
    image: node:20-alpine
    container_name: dlmaposmand
    restart: unless-stopped
    ports:
      # Modifie le port de gauche si 3000 est déjà pris.
      - "3000:3000"
    environment:
      - PORT=3000
    # À chaque (re)démarrage : installe git, clone la dernière version de la
    # branche par défaut (main), puis lance le serveur. Aucun fichier à copier.
    command: >
      sh -c "apk add --no-cache git &&
             rm -rf /srv/app &&
             git clone --depth 1 https://github.com/Foskcru/DlMapOsmAnd.git /srv/app &&
             cd /srv/app && node server.js"
